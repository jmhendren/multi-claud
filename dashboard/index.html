<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Claud Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    overflow-x: auto;
  }

  /* --- Header --- */
  .header {
    padding: 16px 24px;
    border-bottom: 1px solid #1e293b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0f172a;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #f1f5f9;
  }

  .header .project-name {
    font-size: 14px;
    color: #94a3b8;
    padding: 2px 10px;
    background: #1e293b;
    border-radius: 6px;
  }

  .connection-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #64748b;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
  }

  .status-dot.connected { background: #22c55e; }

  /* --- Stats Bar --- */
  .stats-bar {
    display: flex;
    gap: 24px;
    padding: 12px 24px;
    border-bottom: 1px solid #1e293b;
    font-size: 13px;
    color: #94a3b8;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-value {
    font-weight: 600;
    color: #f1f5f9;
  }

  /* --- Risk Banner --- */
  .risk-banner {
    display: none;
    padding: 10px 24px;
    background: #451a03;
    border-bottom: 1px solid #92400e;
    font-size: 13px;
    color: #fbbf24;
  }

  .risk-banner.visible { display: block; }

  .risk-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }

  .risk-badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 3px;
  }

  .risk-badge.critical { background: #dc2626; color: white; }
  .risk-badge.warning { background: #d97706; color: white; }
  .risk-badge.info { background: #2563eb; color: white; }

  /* --- Board --- */
  .board {
    display: flex;
    gap: 12px;
    padding: 20px 24px;
    min-height: calc(100vh - 120px);
    align-items: flex-start;
  }

  /* --- Columns --- */
  .column {
    flex: 1;
    min-width: 260px;
    max-width: 340px;
    background: #1e293b;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
  }

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
  }

  .column-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #94a3b8;
  }

  .column-count {
    font-size: 12px;
    font-weight: 500;
    color: #64748b;
    background: #0f172a;
    padding: 1px 8px;
    border-radius: 10px;
  }

  .column-cards {
    padding: 0 10px 10px;
    min-height: 60px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Column accent colors */
  .column[data-status="backlog"] .column-title { color: #64748b; }
  .column[data-status="ready"] .column-title { color: #38bdf8; }
  .column[data-status="in_progress"] .column-title { color: #fbbf24; }
  .column[data-status="review"] .column-title { color: #c084fc; }
  .column[data-status="complete"] .column-title { color: #4ade80; }

  /* --- Cards --- */
  .card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 12px 14px;
    cursor: default;
    transition: border-color 0.15s, transform 0.1s;
  }

  .card:hover {
    border-color: #475569;
  }

  .card-name {
    font-size: 14px;
    font-weight: 500;
    color: #f1f5f9;
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .card-description {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 8px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
  }

  .tag {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .tag-worker {
    background: #1e3a5f;
    color: #7dd3fc;
    border: 1px solid #1e40af;
  }

  .tag-blocked {
    background: #3b1219;
    color: #fca5a5;
    border: 1px solid #7f1d1d;
  }

  .tag-risk {
    background: #451a03;
    color: #fbbf24;
    border: 1px solid #92400e;
  }

  .tag-deps {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #1e293b;
    font-size: 11px;
    color: #475569;
  }

  /* --- Workers Panel --- */
  .workers-panel {
    padding: 12px 24px 20px;
    border-top: 1px solid #1e293b;
  }

  .workers-panel h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #94a3b8;
    margin-bottom: 10px;
  }

  .workers-grid {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .worker-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 200px;
    flex: 1;
    max-width: 300px;
  }

  .worker-name {
    font-size: 14px;
    font-weight: 500;
    color: #f1f5f9;
    margin-bottom: 4px;
  }

  .worker-status {
    font-size: 12px;
    margin-bottom: 4px;
  }

  .worker-status.idle { color: #64748b; }
  .worker-status.working { color: #4ade80; }
  .worker-status.paused { color: #fbbf24; }
  .worker-status.error { color: #f87171; }
  .worker-status.stopped { color: #64748b; }

  .worker-packet {
    font-size: 11px;
    color: #64748b;
  }

  /* --- Empty state --- */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #475569;
    font-size: 14px;
    grid-column: 1 / -1;
  }

  .empty-state h2 {
    font-size: 20px;
    color: #64748b;
    margin-bottom: 8px;
  }

  /* --- Sortable ghost --- */
  .sortable-ghost {
    opacity: 0.4;
  }

  /* --- Responsive --- */
  @media (max-width: 768px) {
    .board { flex-direction: column; }
    .column { max-width: 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Multi-Claud</h1>
    <span class="project-name" id="projectName">Loading...</span>
  </div>
  <div class="connection-status">
    <div class="status-dot" id="statusDot"></div>
    <span id="connectionLabel">Connecting...</span>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat">Packets: <span class="stat-value" id="statTotal">0</span></div>
  <div class="stat">Complete: <span class="stat-value" id="statComplete">0</span></div>
  <div class="stat">In Progress: <span class="stat-value" id="statInProgress">0</span></div>
  <div class="stat">Blocked: <span class="stat-value" id="statBlocked">0</span></div>
  <div class="stat">Workers Active: <span class="stat-value" id="statWorkers">0</span></div>
  <div class="stat">Risks: <span class="stat-value" id="statRisks">0</span></div>
</div>

<div class="risk-banner" id="riskBanner"></div>

<div class="board" id="board">
  <div class="column" data-status="backlog">
    <div class="column-header">
      <span class="column-title">Backlog</span>
      <span class="column-count" id="countBacklog">0</span>
    </div>
    <div class="column-cards" id="colBacklog"></div>
  </div>
  <div class="column" data-status="ready">
    <div class="column-header">
      <span class="column-title">Ready</span>
      <span class="column-count" id="countReady">0</span>
    </div>
    <div class="column-cards" id="colReady"></div>
  </div>
  <div class="column" data-status="in_progress">
    <div class="column-header">
      <span class="column-title">In Progress</span>
      <span class="column-count" id="countInProgress">0</span>
    </div>
    <div class="column-cards" id="colInProgress"></div>
  </div>
  <div class="column" data-status="review">
    <div class="column-header">
      <span class="column-title">Review</span>
      <span class="column-count" id="countReview">0</span>
    </div>
    <div class="column-cards" id="colReview"></div>
  </div>
  <div class="column" data-status="complete">
    <div class="column-header">
      <span class="column-title">Complete</span>
      <span class="column-count" id="countComplete">0</span>
    </div>
    <div class="column-cards" id="colComplete"></div>
  </div>
</div>

<div class="workers-panel" id="workersPanel" style="display:none">
  <h2>Workers</h2>
  <div class="workers-grid" id="workersGrid"></div>
</div>

<script>
// --- State ---
let state = null;
let workerMap = {};
let packetMap = {};

// --- SSE Connection ---
function connectSSE() {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('connectionLabel');
  const source = new EventSource('/api/events');

  source.addEventListener('state', (e) => {
    dot.classList.add('connected');
    label.textContent = 'Live';
    state = JSON.parse(e.data);
    render(state);
  });

  source.addEventListener('error', (e) => {
    dot.classList.remove('connected');
    label.textContent = 'Reconnecting...';
  });

  source.onerror = () => {
    dot.classList.remove('connected');
    label.textContent = 'Disconnected';
  };
}

// --- Initial load via REST (faster than waiting for first SSE tick) ---
fetch('/api/state')
  .then(r => r.json())
  .then(data => { state = data; render(data); })
  .catch(() => {});

connectSSE();

// --- Render ---
function render(s) {
  // Build lookup maps
  workerMap = {};
  (s.workers || []).forEach(w => { workerMap[w.id] = w; });
  packetMap = {};
  (s.packets || []).forEach(p => { packetMap[p.id] = p; });

  // Header
  document.getElementById('projectName').textContent = s.project?.name || 'Multi-Claud';

  // Stats
  const packets = s.packets || [];
  const activeRisks = (s.risks || []).filter(r => !r.resolved);
  const activeWorkers = (s.workers || []).filter(w => w.status === 'working');

  document.getElementById('statTotal').textContent = packets.length;
  document.getElementById('statComplete').textContent = packets.filter(p => p.status === 'complete').length;
  document.getElementById('statInProgress').textContent = packets.filter(p => p.status === 'in_progress').length;
  document.getElementById('statBlocked').textContent = packets.filter(p => p.status === 'blocked').length;
  document.getElementById('statWorkers').textContent = activeWorkers.length;
  document.getElementById('statRisks').textContent = activeRisks.length;

  // Risk banner
  const banner = document.getElementById('riskBanner');
  if (activeRisks.length > 0) {
    banner.classList.add('visible');
    banner.innerHTML = activeRisks.map(r =>
      `<div class="risk-item">
        <span class="risk-badge ${esc(r.severity)}">${esc(r.severity)}</span>
        <span>${esc(r.description)}</span>
      </div>`
    ).join('');
  } else {
    banner.classList.remove('visible');
  }

  // Columns
  const columns = {
    backlog: [], ready: [], in_progress: [], review: [], complete: []
  };

  packets.forEach(p => {
    const status = p.status || 'backlog';
    if (columns[status]) columns[status].push(p);
    else columns.backlog.push(p);
  });

  // Also treat blocked packets as backlog visually but with a blocked tag
  // Actually, let's show blocked ones in the backlog column with a blocked badge
  const blockedPackets = packets.filter(p => p.status === 'blocked');
  columns.backlog = columns.backlog.concat(blockedPackets.filter(p => !columns.backlog.includes(p)));

  renderColumn('colBacklog', 'countBacklog', columns.backlog);
  renderColumn('colReady', 'countReady', columns.ready);
  renderColumn('colInProgress', 'countInProgress', columns.in_progress);
  renderColumn('colReview', 'countReview', columns.review);
  renderColumn('colComplete', 'countComplete', columns.complete);

  // Workers panel
  const workers = s.workers || [];
  const panel = document.getElementById('workersPanel');
  const grid = document.getElementById('workersGrid');
  if (workers.length > 0) {
    panel.style.display = 'block';
    grid.innerHTML = workers.map(w => {
      const packetName = w.assigned_packet && packetMap[w.assigned_packet]
        ? packetMap[w.assigned_packet].name : '-';
      return `<div class="worker-card">
        <div class="worker-name">${esc(w.name)}</div>
        <div class="worker-status ${esc(w.status)}">${esc(w.status)}</div>
        <div class="worker-packet">Packet: ${esc(packetName)}</div>
      </div>`;
    }).join('');
  } else {
    panel.style.display = 'none';
  }
}

function renderColumn(containerId, countId, packets) {
  const container = document.getElementById(containerId);
  document.getElementById(countId).textContent = packets.length;

  container.innerHTML = packets.map(p => {
    const worker = p.assigned_worker && workerMap[p.assigned_worker]
      ? workerMap[p.assigned_worker] : null;

    const riskCount = state ? (state.risks || []).filter(
      r => !r.resolved && r.affected_packets.includes(p.id)
    ).length : 0;

    let tags = '';
    if (p.status === 'blocked') {
      tags += '<span class="tag tag-blocked">blocked</span>';
    }
    if (worker) {
      tags += `<span class="tag tag-worker">${esc(worker.name)}</span>`;
    }
    if (riskCount > 0) {
      tags += `<span class="tag tag-risk">${riskCount} risk${riskCount > 1 ? 's' : ''}</span>`;
    }
    if (p.depends_on && p.depends_on.length > 0) {
      const depNames = p.depends_on.map(id => packetMap[id] ? packetMap[id].name : id.slice(0, 6));
      tags += `<span class="tag tag-deps">needs: ${esc(depNames.join(', '))}</span>`;
    }

    let footer = '';
    if (p.started_at) {
      const started = new Date(p.started_at);
      footer = `Started ${timeAgo(started)}`;
    }
    if (p.completed_at) {
      const completed = new Date(p.completed_at);
      footer = `Done ${timeAgo(completed)}`;
    }

    return `<div class="card" data-id="${esc(p.id)}">
      <div class="card-name">${esc(p.name)}</div>
      ${p.description ? `<div class="card-description">${esc(p.description)}</div>` : ''}
      ${tags ? `<div class="card-meta">${tags}</div>` : ''}
      ${footer ? `<div class="card-footer">${footer}</div>` : ''}
    </div>`;
  }).join('');
}

// --- Helpers ---
function esc(str) {
  if (typeof str !== 'string') return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function timeAgo(date) {
  const seconds = Math.floor((new Date() - date) / 1000);
  if (seconds < 60) return 'just now';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  return `${days}d ago`;
}
</script>
</body>
</html>
