[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-claud"
version = "0.1.0"
description = "Orchestrate multiple Claude Code sessions working on the same project"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "John Hendren" },
]
keywords = ["claude", "claude-code", "orchestration", "multi-agent", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "fastapi[standard]>=0.135.0",
    "typer>=0.24.0",
    "rich>=14.0.0",
    "filelock>=3.0.0",
    "watchfiles>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
multi-claud = "multi_claud.cli:app"

[project.urls]
Homepage = "https://github.com/johnhendren/multi-claud"
Repository = "https://github.com/johnhendren/multi-claud"
Issues = "https://github.com/johnhendren/multi-claud/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["multi_claud"]
